services:
  db:
    image: postgres:16-alpine
    container_name: supplescope-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: supplescope
      POSTGRES_PASSWORD: supplescope
      POSTGRES_DB: supplescope
    ports:
      - "5432:5432"
    volumes:
      - supplescope_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplescope -d supplescope"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  supplescope_pgdata:
