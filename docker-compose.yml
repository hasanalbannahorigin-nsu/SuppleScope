# SuppleScope: database + back end + web app.
#   docker compose up -d --build        then open http://localhost:8080
# Settings come from .env (copy .env.example). DATABASE_URL is set here to the Postgres service.
# Heavy ML extras (EasyOCR, sentence-transformers, verifier models): docker compose build --build-arg INSTALL_ML=true backend
services:
  db:
    image: postgres:16-alpine
    container_name: supplescope-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: supplescope
      POSTGRES_PASSWORD: supplescope
      POSTGRES_DB: supplescope
    ports:
      - "5432:5432"
    volumes:
      - supplescope_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplescope -d supplescope"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_ML: "false"
        TESSDATA_BEST: "true"
    container_name: supplescope-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://supplescope:supplescope@db:5432/supplescope
      API_CORS_ORIGINS: http://localhost:8080
      STORAGE_ROOT: /app/backend/data/storage
      TESSDATA_PREFIX: /opt/tessdata_best
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - supplescope_data:/app/backend/data            # uploads, research cache, iDISK2.0 database
      - ./backend/models:/app/backend/models          # fine-tuned verifier models (VERIFIER_MODEL_DIRS=models/...)
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: supplescope-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  supplescope_pgdata:
  supplescope_data:
